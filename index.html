<!DOCTYPE html>
<html>

<head>

    <title>GreenMap</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <h1>GreenMap</h1>

        <button>Back to Database</button>

    </nav>


    <main>

        <h2>Find Your Local Environmental Risks</h2>

        <p>Enter your city and state.</p>

        <input
            type="text"
            id="location"
            placeholder="Example: Newark, New Jersey"
        >

        <button id="findButton">
            Find My Area
        </button>


        <div class="results" id="results">

            <h2>Results</h2>

            <p>Your environmental risks will appear here.</p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
